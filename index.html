<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>floydgames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14161a;
    --paper: #f4f2ed;
    --paper-dim: #b9b7b0;
    --brass: #c9a15a;
    --line: rgba(244, 242, 237, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 5rem 6vw 3rem;
    border-bottom: 1px solid var(--line);
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    margin: 0 0 0.6rem;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0;
    max-width: 46ch;
    color: var(--paper-dim);
    font-size: 1.05rem;
    line-height: 1.6;
  }

  main {
    padding: 3rem 6vw 6rem;
  }

  .roster {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 2.5rem;
  }

  .project {
    display: block;
    text-decoration: none;
    color: inherit;
  }

  .project figure {
    margin: 0;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: #1d2027;
    border: 1px solid var(--line);
  }

  .project img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }

  .project:hover img {
    transform: scale(1.04);
  }

  .project-name {
    margin-top: 1rem;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 1.35rem;
    font-weight: 500;
  }

  .project-desc {
    margin-top: 0.35rem;
    color: var(--paper-dim);
    font-size: 0.95rem;
    line-height: 1.55;
  }

  .project:hover .project-name {
    color: var(--brass);
  }

  a:focus-visible, .project:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 4px;
  }
</style>
</head>
<body>

<header>
  <h1>FLOYDTECH GAMES</h1>
  <p>i cant breathe</p>
</header>

<main>
  <div class="roster">

    <a class="project" href="ts-fruitdrop-starter/" target="_blank" rel="noopener">
      <figure>
        <img src="images/floydsimulator.png" alt="Screenshot of Project One">
      </figure>
      <div class="project-name">floyd simulator</div>
      <div class="project-desc">refresh the page once otherwise floyd doesnt spawn in</div>
    </a>

    <a class="project" href="whipanigga/" target="_blank" rel="noopener">
      <figure>
        <img src="images/whipanigga.png" alt="Screenshot of Project Two">
      </figure>
      <div class="project-name">whipanigga</div>
      <div class="project-desc">whip the niggas</div>
    </a>

    <a class="project" href="wheel_of_fortune/" target="_blank" rel="noopener">
      <figure>
        <img src="images/wheel_of_fortune.png" alt="Screenshot of Project Two">
      </figure>
      <div class="project-name">wheel of beer</div>
      <div class="project-desc">spin and win</div>
    </a>

    <!--
      To add a new project, copy one of the <a class="project"> blocks above
      and paste it here. The grid will automatically reflow — no other
      changes needed.
    -->

  </div>
</main>

</body>
</html>
