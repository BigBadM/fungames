<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drift // Game Skeleton</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- MENU SCREEN -->
  <section id="menu-screen" class="screen active">
    <div class="menu-box">
      <h1 class="title">FARM<span>_</span>WHACK</h1>
      <p class="subtitle">// whack-a-mole, but it's a farm</p>
      <div class="menu-buttons">
        <button class="game-btn primary" id="play-btn">▶ Play</button>
        <button class="game-btn" id="store-btn">⌂ Store</button>
      </div>
    </div>
  </section>

  <!-- STORE SCREEN -->
  <section id="store-screen" class="screen">
    <div class="panel">
      <h2>Store</h2>
      <div class="store-item">
        <div>
          <div class="store-item-name">Extra Round Time</div>
          <div class="store-item-desc">Adds 15 seconds to each round</div>
        </div>
        <div class="store-item-price">100 pts</div>
      </div>
      <div class="store-item">
        <div>
          <div class="store-item-name">Slower Retreat</div>
          <div class="store-item-desc">Animals stay up a little longer</div>
        </div>
        <div class="store-item-price">250 pts</div>
      </div>
      <div class="store-item">
        <div>
          <div class="store-item-name">Alt Skin: Golden Mole</div>
          <div class="store-item-desc">Cosmetic animal reskin</div>
        </div>
        <div class="store-item-price">50 pts</div>
      </div>
      <button class="game-btn back-btn" id="store-back-btn">← Back</button>
    </div>
  </section>

  <!-- GAME SCREEN -->
  <section id="game-screen" class="screen">
    <div id="hud">
      <span class="hud-badge">SCORE <span class="score" id="score-display">0</span></span>
      <span class="hud-badge hud-timer" id="timer-display">0:30</span>
      <span class="hud-badge" id="fps-display">60 FPS</span>
    </div>
    <button id="pause-btn">II Pause</button>
    <canvas id="game-canvas"></canvas>

    <div id="pause-overlay">
      <h2>Paused</h2>
      <button class="game-btn primary" id="resume-btn">▶ Resume</button>
      <button class="game-btn" id="quit-btn">■ Quit to Menu</button>
    </div>

    <div id="roundover-overlay">
      <h2>Time's Up!</h2>
      <p id="final-score-display">Score: 0</p>
      <button class="game-btn primary" id="playagain-btn">▶ Play Again</button>
      <button class="game-btn" id="roundover-quit-btn">■ Quit to Menu</button>
    </div>

    <p class="hint">click an animal when it pops up</p>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
