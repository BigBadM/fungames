<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drift // Game Skeleton</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- GAME SCREEN (the only screen — everything else is an overlay on top of it) -->
  <section id="game-screen">
    <div id="hud" class="hidden">
      <span class="hud-badge">SCORE <span class="score" id="score-display">0</span></span>
      <span class="hud-badge hud-timer" id="timer-display">0:30</span>
      <span class="hud-badge" id="fps-display">60 FPS</span>
    </div>
    <button id="pause-btn" class="hidden">II Pause</button>
    <canvas id="game-canvas"></canvas>

    <!-- HOME OVERLAY: shown on first load. Transparent so the game
         (running in an idle "attract" state) is visible behind it. -->
    <div id="home-overlay" class="overlay active">
      <div class="menu-box">
        <h1 class="title">FARM<span>_</span>WHACK</h1>
        <p class="subtitle">// whack-a-mole, but it's a farm</p>
        <div class="menu-buttons">
          <button class="game-btn primary" id="play-btn">▶ Play</button>
        </div>
      </div>
    </div>

    <div id="pause-overlay" class="overlay">
      <h2>Paused</h2>
      <button class="game-btn primary" id="resume-btn">▶ Resume</button>
    </div>

    <div id="roundover-overlay" class="overlay">
      <h2>Time's Up!</h2>
      <p id="final-score-display">Score: 0</p>
      <button class="game-btn primary" id="playagain-btn">▶ Play Again</button>
    </div>

    <p class="hint hidden">click an animal when it pops up</p>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
